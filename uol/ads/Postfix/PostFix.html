<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Postfix++ Interpreter</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css"
    >
</head>
<body>
    <p>
        <a href="../../../index.html">Back to home page</a>
    </p>
    <h1>Postfix++ Interpreter</h1>

    <pre><code id="source" class="language-javascript">Loading...</code></pre>

    <script>
        fetch("./PostFix++.js")
            .then((response) => {
                if (!response.ok) {
                    throw new Error(`Unable to load source: ${response.status}`);
                }
                return response.text();
            })
            .then((source) => {
                document.querySelector("#source").textContent = source;
                Prism.highlightElement(document.querySelector("#source"));
            })
            .catch((error) => {
                document.querySelector("#source").textContent =
                    `Unable to display source: ${error.message}`;
            });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
</body>
</html>
