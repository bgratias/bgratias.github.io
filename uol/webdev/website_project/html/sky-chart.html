<!DOCTYPE html>
<html lang="en">

<head>
    <!-- preconnect does handshaking in advance so downloads are faster when called later -->
    <link rel="preconnect" href="https://fonts.googleapis.com"> 
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>   

    <!-- external links for this page -->
    <link rel="stylesheet" href="/css/sky-events-chart.css">
    <!-- use JavaScript includeHTML() to add html from separate file -->
    <div w3-include-html-snip="/html/html-snips/head-snip.html"></div>
    <!-- loading this script in the head so that the HTML it generates will be available for parsing as soon as possible -->
    <script src="/js/includeHTML.js"></script>

    <!-- page information-->    
    <title>Shanghai Astronomy Club - Sky Chart</title>
    <meta name="author" content="BGG">
    <meta name="title" content="Shanghai Astronomy Club - Sky Chart">
    <meta name="description" content="The Shanghai Astronomy Club is a group of likeminded people who love the stars.  Welcome to seasoned astronomers and curious hobiests alike.">
    <meta name="keywords" content="Astronomy, Club, Shanghai"> <!--Set keywords for SE-->
        
</head>

<body>
    
    <header>

        <section class="top-photo">
            <a href="/index.html">
                <img src="/images/header/shanghai-stars-1200x627.jpg" alt="Shanghai skyline with stars above" >
            </a>
            <h1>SHANGHAI<br>Astronomy<br>Club</h1>
            <p id="coordinates"> <span>31.2304° N,</span> <span>121.4737° E</span></p>
            <!-- #time is a placeholder. Script will insert the current time in shanghai -->
            <p id="time"></p>
        </section>    
    
        <!-- use JavaScript includeHTML() to add nav bar html from separate file -->
        <div w3-include-html-snip="/html/html-snips/nav-snip.html"></div>

        <!-- since sky-chart and sky-events share the same css file this button styling needs to be done inline -->
        <style>#button-sky-chart{color: var(--theme-text-hoverblue);}</style> 

    </header>

        
    <main>
        <h2>Shanghai Sky Chart</h2>

        <section id="skyconditions">

            <div id="shanghai-date">
                <h3>Shanghai Date: </h3>
                <!-- "--Loading--" is a placeholder. Script will calculate and replace this content -->
                <p>--Loading--</p>
            </div>
            <div id="shanghai-time">
                <h3>Shanghai Time:</h3>
                <p>--loading--</p>
            </div>
            <div id="UTC-time">
                <h3>UTC Time: </h3>
                <p>--loading--</p>
            </div>

            <div id="rise-set">
                <h3>Sun</h3>
                <div id="sun" class="rise-set">
                    <div class="rise">
                        <!-- there is no alt"" text for these icons since they are decorative and do not impart any information -->
                        <!-- setting a width and height prevents the page from jumping around as it loads -->
                        <img src="/images/sky-events-chart/rise-set/sun-rise.png" alt="" width="32" height="32">
                        <p>--Loading--</p>
                    </div>

                    <div class="set">
                        <img src="/images/sky-events-chart/rise-set/sun-set.png" alt="" width="32" height="32">    
                        <p>--Loading--</p>
                    </div>
                </div>

                <h3>Moon</h3>
                <div id="moon" class="rise-set">
                    <div class="rise">
                        <img src="/images/sky-events-chart/rise-set/moon-rise.png" alt="" width="32" height="32">
                        <p>--Loading--</p>
                    </div>

                    <div class="set">
                        <img src="/images/sky-events-chart/rise-set/moon-set.png" alt="" width="32" height="32">    
                        <p>--Loading--</p>
                    </div>
                </div>
            </div>

            <div id="moon-phase">
                <h3>Moon Phase:</h3>
                <!-- Using javascript this image will be replaced with an image showing the current moon phase -->
                <img src="/images/sky-events-chart/moonphases/001-moon.svg" alt="current moon phase">
            </div>
        </section>

        <section id="star-chart">
            <div class="iframe-container">
                <!-- places a loading spinner that is only visible until the starchart is loaded -->
                <div class="loading" >
                    <img src="/images/sky-events-chart/loading.png" alt="">
                </div>
    
                <!-- Custom starchart generated by virtualsky.lco.global -->
                <!-- I have configured this widget for an observer in Shanghai on today's date -->
                <!-- Additional customizations made for colour and styling -->
                <iframe 
                    title="Sky Chart provided by virtualsky.lco.global"
                    width="800" 
                    height="800" 
                    marginheight="0" 
                    marginwidth="0" 
                    loading="lazy"
                    scrolling="no" 
                    frameborder="0" 
                    allowtransparency="true"
                    allowfullscreen
                    src="https://virtualsky.lco.global/embed/index.html?longitude=121.4737&latitude=31.2304&projection=polar&keyboard=false&constellations=true&meteorshowers=true&showdate=false&showposition=false&ecliptic=true&gridlines_az=true&background=rgba(37,37,42,0)&magnitude=6&az=178.4319800578504&gradient=false">
                </iframe>
            </div>
        </section>
    </main>

    <footer>
        <!-- use JavaScript includeHTML() to add footer html from separate file -->
        <div w3-include-html-snip="/html/html-snips/footer-snip.html"></div>
    </footer>

    <!-- use JavaScript to add html snips from exterior files -->
    <script>includeHTML()</script>

    <!-- these scripts are located at the end of the body since their content is not critical to the loading of the page -->

    <!-- these scripts calculate and update astro events displayed on the page -->
    <script src="/js/libraries/astronomy.browser.js"></script>
    <script src="/js/updateSkyEvents.js"></script>

    <!-- this script updates the time in the header -->
    <script src="/js/updateHeaderTime.js"></script>
    
</body>

</html>
